<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Entrar — Heimdall Nexus</title>
<link rel="icon" href="{{ raiz }}/estatico/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="{{ raiz }}/estatico/fontes/fontes.css?v={{ v }}">
<link rel="stylesheet" href="{{ raiz }}/estatico/painel.css?v={{ v }}">
</head>
<body>
<div class="porta">
  <form method="post" action="{{ raiz }}/entrar">
    <h1>Salão do Jarl</h1>
    <p>Valheim Server Management Platform · BRKiHeL</p>
    {% if erro %}<div class="erro-caixa">{{ erro }}</div>{% endif %}
    {% if sem_senha %}
      <div class="aviso-caixa">Nenhuma senha definida ainda. No servidor, rode
        <code>sudo ./definir-senha.py</code> dentro de <code>painel/</code>.</div>
    {% endif %}
    <input type="password" name="senha" placeholder="senha" autocomplete="current-password"
           autofocus required>
    <button class="btn principal" type="submit" style="margin-top:1rem; width:100%">Entrar</button>
  </form>
</div>
</body>
</html>
